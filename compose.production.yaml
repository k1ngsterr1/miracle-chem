services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-betonflow}
    volumes:
      - betonflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-betonflow}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4100
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-betonflow}?schema=public
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      # CRM использует собственную страницу входа и защищённую HttpOnly-сессию.
      AUTH_MODE: session
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?set AUTH_SESSION_SECRET (32+ random characters)}
      ONE_C_SYNC_API_KEY: ${ONE_C_SYNC_API_KEY:?set ONE_C_SYNC_API_KEY (32+ random characters)}
      ONE_C_SYNC_WORKSPACE_ID: ${ONE_C_SYNC_WORKSPACE_ID:?set ONE_C_SYNC_WORKSPACE_ID}
      ONE_C_SYNC_SOURCE_INSTANCE_ID: ${ONE_C_SYNC_SOURCE_INSTANCE_ID:?set ONE_C_SYNC_SOURCE_INSTANCE_ID}
      ONE_C_SYNC_ORGANIZATION_ID: ${ONE_C_SYNC_ORGANIZATION_ID:?set ONE_C_SYNC_ORGANIZATION_ID}
      ONE_C_ARCHIVE_ENCRYPTION_KEY: ${ONE_C_ARCHIVE_ENCRYPTION_KEY:?set ONE_C_ARCHIVE_ENCRYPTION_KEY (base64, 32 bytes)}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      UPLOAD_STORAGE_DIR: /app/storage
    volumes:
      - betonflow_storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?set CRM_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - betonflow_caddy_data:/data
      - betonflow_caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:-betonflow}
    command:
      - sh
      - -ec
      - |
        while true; do
          timestamp="$$(date -u +%Y%m%dT%H%M%SZ)"
          pg_dump --host=postgres --username="$$POSTGRES_USER" --format=custom --file="/backups/miracle-chem-$$timestamp.dump" "$$POSTGRES_DB"
          tar -C /storage -czf "/backups/miracle-chem-$$timestamp-storage.tar.gz" .
          find /backups -type f \( -name 'miracle-chem-*.dump' -o -name 'miracle-chem-*-storage.tar.gz' \) -mtime +30 -delete
          sleep 86400
        done
    volumes:
      - betonflow_backups:/backups
      - betonflow_storage:/storage:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  betonflow_postgres:
  betonflow_storage:
  betonflow_backups:
  betonflow_caddy_data:
  betonflow_caddy_config:
